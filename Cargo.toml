[package]
name = "tass"
description = "A pager for tabular data"
version = "0.11.0"
authors = ["Alex Sayers <alex@asayers.com>"]
edition = "2024"
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/asayers/tass"

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
arrow = { version = "55.0.0", features = ["chrono-tz"] }
bpaf = { version = "0.9.19", features = ["derive"] }
chrono = "0.4.40"
chrono-tz = "0.10"
color = "0.2.3"
crossterm = "0.29.0"
datafusion = { version = "47.0.0", optional = true }
fileslice = { version = "0.5", default-features = false }
foldhash = "0.1.5"
memchr = "2.7.4"
num-traits = "0.2.19"
parquet = { version = "55.0.0", optional = true }
tempfile = "3.19.1"
tokio = { version = "1.44", optional = true, features = ["rt", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-width = "0.2.0"

[features]
default = ["parquet", "csv", "json"]
virt = ["dep:datafusion", "dep:tokio"]
csv = []
json = []
parquet = ["dep:parquet"]
